# Local development stack (SPEC §13): the journal's storage, and the model
# sidecars a tier of tests needs a real one of.
services:
  postgres:
    # Pinned for the same reason as the Go tools: a server release must not
    # turn a green test red with no code change.
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: chorus
      POSTGRES_USER: chorus
      # Default is a throwaway for a loopback container. A real deployment
      # overrides it from a gitignored .env; see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chorus}
    ports:
      - "127.0.0.1:5432:5432"
    # `task test:db` runs as soon as compose returns, so readiness must be the
    # container's claim and not a sleep in the Taskfile.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorus -d chorus"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - journal:/var/lib/postgresql/data

  # TTS (SPEC §10). The CPU image: a dev box has no GPU, and the API is the
  # same one the GPU image serves, so only the render time differs -- roughly a
  # third of real time here.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    ports:
      - "127.0.0.1:8880:8880"
    # The model loads at boot, so the port opens well before a request can be
    # served. start_period covers the warm-up without lengthening a retry.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8880/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  # STT (SPEC §10). Parakeet TDT 0.6B v2 behind speaches' OpenAI-compatible
  # /v1/audio/transcriptions, as an ONNX export on CPU. 0.9.0-rc.1 is the
  # first tag that serves Parakeet and, as of 2026-10-08, the last one
  # published; a pre-release, pinned because `latest-cpu` moves (ADR-0024).
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.1-cpu
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Never unload the model between utterances: the default evicts it after
      # five idle minutes, and an idle household must not pay a reload on the
      # first word of the next turn (SPEC §11).
      STT_MODEL_TTL: "-1"
    # The server starts without any model; `task stt:up` downloads Parakeet
    # into this volume through the API after the container is healthy, so a
    # recreate does not pull it again.
    volumes:
      - stt-models:/home/ubuntu/.cache/huggingface/hub
    # Upstream's own check. curl is in the image; python is only inside the
    # server's venv.
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Speaker ID (SPEC §10, §5). Built here rather than pulled: there is no
  # published image for this contract, which is the repo's own
  # (sidecars/speakerid/README.md). The model is one release asset, fetched
  # at build and verified against the digest the sidecar pins, so the
  # container never reaches the network and serves what it was built with
  # (ADR-0029). CPU only: the runtime wheel is the CPU build.
  speakerid:
    build:
      # The repo root is the uv workspace root, which is where the lockfile
      # the image installs from lives.
      context: .
      dockerfile: sidecars/speakerid/Dockerfile
    ports:
      - "127.0.0.1:8890:8890"
    # The port opens only after the model is loaded, so the check is a
    # readiness check. start_period covers the digest check and load, which
    # take a second or two on a CPU box.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8890/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  journal:
  stt-models:
