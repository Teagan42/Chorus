# Reusable chorus_bridge wiring. Consume with:
#
#   packages:
#     chorus: !include
#       file: packages/chorus-bridge.yaml
#       vars:
#         orchestrator_host: 10.0.0.10
#         microphone_id: xmos_mic
#         speaker_id: tts_source
#
# A board with a mixer adds ducking in its own config; package keys merge:
#
#   chorus_bridge:
#     ducking_speaker: media_source
#
# `voice_assistant:` must NOT also be present. Its half-duplex state machine
# stops the mic during TTS, which is the limit this component exists to escape
# (SPEC §3.1).

defaults:
  orchestrator_port: "6055"

external_components:
  # Local, not a git ref: the component and the orchestrator share a wire
  # protocol, so they must be versioned together (docs/adr/0010).
  #
  # Relative to the including config's directory, not to this file. That is
  # ESPHome 2026.7 behaviour and it changed in 2026.9, so consumers of this
  # package must live in esphome/.
  - source:
      type: local
      path: components
    components: [chorus_bridge]

chorus_bridge:
  id: chorus
  host: ${orchestrator_host}
  port: ${orchestrator_port}
  speaker: ${speaker_id}
  microphone:
    # Channel 0 is the XMOS's fully processed mix; channel 1 its second
    # output. Both are non-passive by construction -- see the component's
    # to_code.
    - microphone: ${microphone_id}
      channels: [0]
    - microphone: ${microphone_id}
      channels: [1]

# On-device wake word, stage one of SPEC §9.3. In code it is independent of
# the bridge (SPEC §3.2); it is wired here because the host opens a session
# only on a WAKE frame (internal/listen), so a bridge without a detector
# streams audio nobody ever answers. A second non-passive consumer on the
# same microphone: it never stops the mic the bridge is reading.
micro_wake_word:
  id: wake_detector
  microphone:
    # The processed mix, the same channel the host confirms the wake on.
    microphone: ${microphone_id}
    channels: [0]
  models:
    # The household's own "Hey Eddie" (SPEC §13), served from its Home
    # Assistant's www folder: ESPHome reads the manifest at config time and
    # fetches the .tflite it names beside it. The URL is the household's to
    # change, so nothing pins it the way a commit pins a stock model; a
    # retrained model lands on the next compile. The select below follows
    # whichever model is loaded, so its three levels survive a retrain.
    - model: https://automation.constructorfleet.stream/local/hey_eddie/hey_eddie.json
      id: wake_model
  # Full duplex: the detector keeps running through the session and through
  # playback, so it never releases the mic (SPEC §3.1). Whether a detection
  # becomes a session is the host's decision (SPEC §9.3), so a repeat is a
  # frame it ignores, not a problem here.
  stop_after_detection: false
  on_wake_word_detected:
    - lambda: id(chorus).on_wake_word(wake_word);

# micro_wake_word does not start itself; the stock firmware starts it from
# voice_assistant, which this config has no copy of. Last, so the microphone
# it claims is set up.
esphome:
  on_boot:
    - priority: -100
      then:
        - micro_wake_word.start:
            id: wake_detector

# The relief for cough false-accepts that needs no retraining (SPEC §3.3.1,
# §9.3): the model's cutoff, set over the native API. Relative to the loaded
# model's own cutoff so a swapped-in model keeps the three levels. The setter
# takes the cutoff quantised to a byte, so 5 is about 0.02 of probability.
select:
  - platform: template
    id: wake_word_sensitivity
    name: Wake word sensitivity
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Default
    options:
      - Less sensitive
      - Default
      - More sensitive
    on_value:
      - lambda: |-
          const uint8_t base = id(wake_model).get_default_probability_cutoff();
          uint8_t cutoff = base;
          if (x == "Less sensitive") {
            cutoff = base + 5 > 255 ? 255 : base + 5;
          } else if (x == "More sensitive") {
            cutoff = base - 8;
          }
          id(wake_model).set_probability_cutoff(cutoff);
