# Copy to esphome/secrets.yaml (gitignored) and fill in real values.
# api_encryption_key must match the `psk` for this satellite in devices.yaml:
# the orchestrator dials the device with it (SPEC §3.1). Generate with
# `openssl rand -base64 32`.
api_encryption_key: BASE64_32_BYTE_KEY_HERE
wifi_ssid: YOUR_SSID
wifi_password: YOUR_WIFI_PASSWORD
