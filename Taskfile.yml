# Single entry point across Go, Python, CUE, and ESPHome toolchains.
# Tiered tests: `test` is hermetic and always runnable; `test:models` needs a
# GPU; `test:hardware` needs a reachable satellite. See CONTRIBUTING.md.
version: "3"

vars:
  GOBIN:
    sh: go env GOPATH
  PKG: github.com/teagan42/chorus
  # Pinned for the same reason as the Go tools: a component API change must
  # not turn a green build red with no code change. Bump on purpose.
  ESPHOME_VERSION: 2026.7.2
  # task hardware:kicad builds boards in this; .github/workflows/hardware.yml pins the same.
  KICAD_IMAGE: kicad/kicad:9.0.5@sha256:699f65fd2e4670bbdbe6846586768207f9f1528edd526c0e0502fda7c7f9bfad

env:
  PATH: "{{.GOBIN}}/bin:{{.PATH}}"

tasks:
  default:
    cmds: [task: check]

  # ---------------------------------------------------------------- toolchain
  tools:
    desc: Install pinned dev tools into GOPATH/bin
    vars:
      # A tool formats with the go/printer it was built by, so protoc-gen-go
      # from a Go 1.24 regenerates a diff CI cannot see. go.mod's line is the
      # Go CI builds with. sed, not `go list`: under GOTOOLCHAIN=local an
      # older Go cannot load this module at all.
      GO_PIN:
        sh: sed -n 's/^go /go/p' go.mod
    cmds:
      # Pinned, not @latest: the hook and CI must agree, and a linter or gofumpt
      # release must not turn a green PR red with no code change. Bump on purpose.
      # GOTOOLCHAIN per command: setup-go exports one, and that beats a task env.
      - GOTOOLCHAIN={{.GO_PIN}} go install github.com/bufbuild/buf/cmd/buf@v1.73.0
      - GOTOOLCHAIN={{.GO_PIN}} go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - GOTOOLCHAIN={{.GO_PIN}} go install cuelang.org/go/cmd/cue@v0.17.1
      - GOTOOLCHAIN={{.GO_PIN}} go install mvdan.cc/gofumpt@v0.12.0
      # Separate command: two modules in one `go install` fails.
      # CGO_ENABLED=0: the only cgo build here, and it breaks on a bad macOS SDK.
      - CGO_ENABLED=0 GOTOOLCHAIN={{.GO_PIN}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
      # Quoted: the unquoted ": " in the URL would parse as a YAML mapping.
      - 'command -v uv >/dev/null || echo "install uv -> https://docs.astral.sh/uv/"'
      # Hooks are opt-in per clone; git will not enable them automatically.
      - git config core.hooksPath .githooks

  # ------------------------------------------------------------------- codegen
  gen:
    desc: Regenerate everything derived from schemas
    cmds: [task: gen:proto, task: gen:cue, task: gen:hardware]

  gen:proto:
    desc: ESPHome API bindings from the vendored proto
    sources: ["proto/esphome/*.proto", "buf.gen.yaml"]
    generates: ["internal/pb/*.pb.go"]
    cmds: [buf generate]

  gen:cue:
    desc: Go types, JSON Schema, and docs from CUE schemas
    # The generator's own source counts: a renderer change with untouched CUE
    # still changes every artifact, and the fingerprint would skip it.
    sources: ["schema/**/*.cue", "internal/tools/schemagen/*.go"]
    cmds: [go run ./internal/tools/schemagen]

  gen:hardware:
    desc: KiCad netlist and JLCPCB BOM from each board's netlist data
    sources: ["hardware/**/*.yaml", "internal/board/*.go", "internal/tools/kicadnet/*.go"]
    cmds: [go run ./internal/tools/kicadnet hardware/chorus-main]

  # In the KiCad image pinned above: pcbnew's file format and its footprint
  # libraries are what the board is built from, so a moving tag would move it.
  hardware:kicad:
    desc: KiCad 9 project and board for each board, zipped for KiCad or EasyEDA (needs Docker)
    deps: [gen:hardware]
    cmds:
      - mkdir -p dist/hardware
      - >-
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -w /src
        {{.KICAD_IMAGE}}
        python3 internal/tools/kicadboard/build.py hardware/chorus-main dist/hardware

  hardware:test:
    desc: The board builder's tests, inside the KiCad image (needs Docker)
    cmds:
      - >-
        docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/src:ro" -w /src
        {{.KICAD_IMAGE}}
        python3 -m unittest discover -s internal/tools/kicadboard -v

  gen:check:
    desc: Fail if generated output is stale (CI gate)
    cmds:
      - task: gen
      - |
        # --porcelain, not `git diff`: a newly generated file is untracked, and
        # `git diff` does not see untracked files.
        dirty=$(git status --porcelain -- \
          'internal/pb' '*.gen.go' 'schema/json' 'docs/reference' \
          'hardware/*/*.net' 'hardware/*/bom.csv')
        if [ -n "$dirty" ]; then
          echo "ERROR: generated output is stale or uncommitted." >&2
          echo "Run 'task gen' and commit the result in a chore(gen) commit." >&2
          printf '%s\n' "$dirty" >&2
          exit 1
        fi

  # --------------------------------------------------------------------- tests
  test:
    desc: Hermetic tests. No network, no GPU, no hardware.
    cmds:
      - go test -race -count=1 ./...

  test:cover:
    desc: Hermetic tests with coverage report
    cmds:
      - go test -race -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  test:db:
    desc: Requires Postgres. Start one with `task db:up`.
    cmds:
      # -p 1: every package shares one database, and the store conformance
      # suites truncate their tables, which would wipe a conversation another
      # package's test is still reading.
      - go test -race -count=1 -p 1 -tags=db ./...

  test:e2e:
    desc: Review UI in a headless Chrome. Skips unless CHORUS_E2E_CHROME names one.
    cmds:
      # -run, not ./...: the tag adds the browser tests to a package whose
      # hermetic tests `task test` already ran.
      # `CHORUS_E2E_CHROME=$(command -v chromium) task test:e2e`; set
      # CHORUS_E2E_SHOTS to a directory to keep a screenshot of every screen.
      - go test -race -count=1 -tags=e2e -run '^TestE2E' ./cmd/reviewui

  db:up:
    desc: Start the local journal database
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop the local journal database, keeping the volume
    cmds:
      - docker compose stop postgres

  test:models:
    desc: Requires model sidecars. Each skips until pointed at one.
    cmds:
      # No endpoint is committed, so an endpoint flag comes from the caller --
      # and one package at a time, since a test binary rejects a flag it does
      # not define: `task test:models -- ./internal/provider/kokoro -kokoro-url http://127.0.0.1:8880`
      # or `task test:models -- ./internal/provider/speaches -stt-url http://127.0.0.1:8000 -stt-wav /path/to/0.wav`
      # (the STT tiers take a WAV of consented speech the same way, since no
      # recording lives in the repo; `./internal/stt` takes the same two flags)
      # or `task test:models -- ./internal/hass -hass-url http://127.0.0.1:8123 -hass-token "$HASS_TOKEN"`
      # or `task test:models -- -v ./internal/provider/smartturn -smartturn-url http://127.0.0.1:8891 -smartturn-wavs .corpus/turns`
      # (after `task smartturn:corpus`; -v prints each take's verdict, and
      # `-stt-url http://127.0.0.1:8000` judges each again with its words)
      # (complete/*.wav and incomplete/*.wav; `./cmd/chorusd` takes the URL and one -smartturn-wav)
      - go test -race -count=1 -tags=models {{.CLI_ARGS | default "./..."}}

  tts:up:
    desc: Start the local TTS sidecar. First run pulls ~4.5 GB.
    cmds:
      - docker compose up -d --wait kokoro

  tts:down:
    desc: Stop the local TTS sidecar
    cmds:
      - docker compose stop kokoro

  stt:up:
    desc: Start the local STT sidecar and download Parakeet into it
    cmds:
      - docker compose up -d --wait speaches
      # The image ships no model, and compose cannot run a request against a
      # healthy container, so the download is a second step. The reply is
      # printed rather than checked: the server's answer to a model it already
      # holds is not verified, and a failure here shows up as a 404 from
      # `task test:models` naming the model.
      - curl -sS -X POST http://127.0.0.1:8000/v1/models/istupakov/parakeet-tdt-0.6b-v2-onnx; echo

  stt:down:
    desc: Stop the local STT sidecar, keeping the downloaded model
    cmds:
      - docker compose stop speaches

  speakerid:up:
    desc: Start the local speaker-ID sidecar. First run builds the image and bakes the ~100 MB model.
    cmds:
      - docker compose up -d --wait --build speakerid

  speakerid:down:
    desc: Stop the local speaker-ID sidecar
    cmds:
      - docker compose stop speakerid

  speakerid:serve:
    desc: Serve the speaker-ID sidecar without Docker on 127.0.0.1:8890. First run fetches the model into .models/.
    cmds:
      - uv sync --all-packages
      # The runtime is CPU only and the model is one verified file, so a dev
      # box needs no image; this is also what the models tier here ran against.
      - uv run --package speakerid speakerid --download-only --model-dir .models/speakerid
      - uv run --package speakerid speakerid --model-dir .models/speakerid --host 127.0.0.1 --port 8890

  speakerid:test:
    desc: The sidecar's own contract tests. Hermetic, but Python, so not part of `task test`.
    cmds:
      - uv sync --all-packages
      - uv run pytest sidecars/speakerid

  smartturn:up:
    desc: Start the local Smart Turn sidecar. First run builds the image and bakes the 8 MB model.
    cmds:
      - docker compose up -d --wait --build smartturn

  smartturn:down:
    desc: Stop the local Smart Turn sidecar
    cmds:
      - docker compose stop smartturn

  smartturn:serve:
    desc: Serve the Smart Turn sidecar without Docker on 127.0.0.1:8891. First run fetches the model into .models/.
    cmds:
      - uv sync --all-packages
      - uv run --package smartturn smartturn --download-only --model-dir .models/smartturn
      - uv run --package smartturn smartturn --model-dir .models/smartturn --host 127.0.0.1 --port 8891

  smartturn:test:
    desc: The sidecar's own contract tests. Hermetic, but Python, so not part of `task test`.
    cmds:
      - uv sync --all-packages
      - uv run pytest sidecars/smartturn

  test:sidecars:
    desc: Both Python sidecars' tests against their real pinned models, and ruff. First run fetches ~110 MB into .models/.
    cmds:
      - uv sync --all-packages
      - uv run ruff check sidecars
      - uv run ruff format --check sidecars
      # The same verified fetch the servers do at boot; a file already there
      # is kept only if its digest matches, so a cached .models costs nothing.
      - uv run --package speakerid speakerid --download-only --model-dir .models/speakerid
      - uv run --package smartturn smartturn --download-only --model-dir .models/smartturn
      - uv run pytest sidecars
    env:
      SPEAKERID_MODEL_DIR: .models/speakerid
      SMARTTURN_MODEL_DIR: .models/smartturn

  smartturn:corpus:
    desc: Render finished and cut-off household commands with Chatterbox into .corpus/turns for the models tier. First run fetches torch and the weights.
    cmds:
      # A standalone script with its own environment, so torch never enters
      # the workspace lockfile. Arguments pass through, e.g. -- --voice me.wav
      - uv run --script sidecars/smartturn/corpus.py {{.CLI_ARGS}}

  test:hardware:
    desc: Requires a reachable satellite from devices.yaml.
    cmds:
      - go test -count=1 -tags=hardware ./...

  test:docs:
    desc: Extract and run code examples from markdown
    cmds:
      - go run ./internal/tools/docexec docs/ CONTRIBUTING.md

  # ----------------------------------------------------------------- docs site
  # The site is docs/ and the root Markdown as they are; mkdocs.yml says how.
  # Material nags about MkDocs 2 on every run; the pin in pyproject.toml is
  # the answer, so the nag is silenced rather than read.
  docs:serve:
    desc: Preview the docs site on 127.0.0.1:8000, rebuilding on save
    env: {NO_MKDOCS_2_WARNING: "1"}
    cmds: ["uv run --group docs mkdocs serve {{.CLI_ARGS}}"]

  docs:build:
    desc: Build the docs site into site/. Strict, so a broken link or image fails it.
    env: {NO_MKDOCS_2_WARNING: "1"}
    cmds: ["uv run --group docs mkdocs build"]

  docs:test:
    desc: The site hooks' own tests and lint. Python, so not part of `task test`.
    env: {NO_MKDOCS_2_WARNING: "1"}
    cmds:
      - uv run --group docs ruff check internal/tools/docsite
      - uv run --group docs ruff format --check internal/tools/docsite
      - uv run --group docs pytest internal/tools/docsite

  docs:shots:
    desc: Re-take every committed review UI screenshot from the browser tests (needs CHORUS_E2E_CHROME)
    cmds:
      - |
        shots=$(mktemp -d)
        CHORUS_E2E_SHOTS="$shots" task test:e2e
        # A committed screenshot the tests no longer take is deleted, so a doc
        # still showing that screen fails `task docs:build`.
        for f in docs/reviewui/*.png docs/reviewui/e2e/*.png; do
          cp "$shots/$(basename "$f")" "$f" 2>/dev/null || rm "$f"
        done
        rm -rf "$shots"

  docs:e2e:
    desc: The built site in a headless Chrome. Skips unless CHORUS_E2E_CHROME names one.
    deps: [docs:build]
    cmds:
      - CHORUS_DOCS_SITE={{.ROOT_DIR}}/site go test -race -count=1 -tags=e2e ./internal/tools/docsite

  # ---------------------------------------------------------------- hosted demo
  # The review UI compiled to WebAssembly over the household's Thursday
  # (internal/reviewui/household), published beside the docs at /demo/.
  demo:build:
    desc: Build the in-browser review UI demo into site/demo. After docs:build, which empties site/.
    cmds: ["go run ./internal/tools/demosite -out site/demo"]

  demo:serve:
    desc: Build the demo and serve it on http://127.0.0.1:8090/demo/
    deps: [demo:build]
    cmds: ["python3 -m http.server --directory site --bind 127.0.0.1 8090"]

  household:voice:
    desc: Re-speak the household fixture's clips from voice.json with Kokoro (fetches the model once). -- --who alice for one person's
    cmds: ["uv run --group voice python internal/tools/householdvoice/voice.py {{.CLI_ARGS}}"]

  household:voice:clone:
    desc: Re-speak named people's clips in voices Chatterbox clones from a recording of them, e.g. -- --voice alan=alan.wav. First run fetches torch and the weights.
    cmds:
      # A standalone script with its own environment, like smartturn:corpus,
      # so torch never enters the workspace lockfile.
      - uv run --script internal/tools/householdvoice/clone.py {{.CLI_ARGS}}

  household:voice:test:
    desc: The household voice generators' own tests and lint, with stand-in engines. Python, so not part of `task test`.
    cmds:
      - uv run --group voice ruff check internal/tools/householdvoice
      - uv run --group voice ruff format --check internal/tools/householdvoice
      - uv run --group voice pytest internal/tools/householdvoice

  # -------------------------------------------------------------- spec tracing
  spec:
    desc: Report SPEC.md clause/test traceability
    cmds: [go run ./internal/tools/spectrace docs/SPEC.md]

  spec:check:
    desc: Fail on spec clauses that claim coverage but have none (CI gate)
    cmds: [go run ./internal/tools/spectrace -strict docs/SPEC.md]

  # --------------------------------------------------------------------- hygiene
  fmt:
    desc: Format everything
    cmds:
      - gofumpt -w .
      - cue fmt ./schema/...
      - sh -c 'command -v uv >/dev/null && uv run ruff format sidecars || true'

  lint:
    cmds:
      # Fail loudly on a missing tool. Piping `gofumpt -l` into a guard made an
      # absent binary look like a clean tree.
      - 'for t in gofumpt cue golangci-lint; do command -v $t >/dev/null || { echo "lint: $t not installed; run task tools" >&2; exit 1; }; done'
      - go vet ./...
      - 'test -z "$(gofumpt -l .)" || { echo "unformatted (run task fmt):" >&2; gofumpt -l . >&2; exit 1; }'
      # -c (concrete) is load-bearing: plain `cue vet` does not evaluate the
      # conditional policy constraints and passes on known-bad schemas.
      - cue vet -c ./schema/
      - golangci-lint run ./...

  commit:check:
    desc: Enforce atomic-commit rules on HEAD (or RANGE=a..b)
    cmds: ["go run ./internal/tools/atomic {{.CLI_ARGS}}"]

  check:
    desc: What CI runs on every push
    cmds:
      - task: lint
      - task: gen:check
      - task: test
      - task: test:docs
      - task: spec:check

  # ------------------------------------------------------------------ firmware
  # esphome is a Python tool and is not pinned in GOPATH/bin like the rest.
  # uvx resolves it per invocation so no venv has to be checked in.
  firmware:config:
    desc: Validate the satellite YAML and the chorus_bridge config schema
    dir: esphome
    cmds:
      - test -f secrets.yaml || { echo "copy secrets.example.yaml to secrets.yaml first" >&2; exit 1; }
      - uvx --from 'esphome=={{.ESPHOME_VERSION}}' esphome config {{.CLI_ARGS | default "satellite1.yaml"}}

  # The handshake MAC as the firmware computes it, built for the host against
  # mbedTLS and checked on the golden frames the Go side is (ADR-0066). No
  # ESPHome, no ESP-IDF: chorus_auth.h includes neither.
  firmware:test:
    desc: Check the firmware's handshake MAC on the host against the Go golden frames
    cmds:
      - >-
        sh -c 'out=$(mktemp -d) && trap "rm -rf $out" EXIT &&
        c++ -std=c++17 -Wall -Wextra -Werror -I esphome/components/chorus_bridge
        esphome/test/chorus_auth_test.cpp -lmbedcrypto -o "$out/chorus_auth_test" &&
        "$out/chorus_auth_test" internal/bridge/testdata/handshake-v3.hex'

  firmware:compile:
    desc: Compile the satellite firmware. Downloads ESP-IDF on first run.
    dir: esphome
    cmds:
      - uvx --from 'esphome=={{.ESPHOME_VERSION}}' esphome compile {{.CLI_ARGS | default "satellite1.yaml"}}

  firmware:upload:
    desc: Flash a satellite over the air
    dir: esphome
    cmds:
      - uvx --from 'esphome=={{.ESPHOME_VERSION}}' esphome upload {{.CLI_ARGS | default "satellite1.yaml"}}

  firmware:logs:
    desc: Stream device logs while proving full duplex
    dir: esphome
    cmds:
      - uvx --from 'esphome=={{.ESPHOME_VERSION}}' esphome logs {{.CLI_ARGS | default "satellite1.yaml"}}

  # ----------------------------------------------------------------- dev loops
  run:
    desc: Run the orchestrator daemon (needs devices.yaml, .env and `task db:up`)
    # The daemon reads its endpoints from the environment; .env is where the
    # gitignored copy of .env.example lives, and this is the one task that
    # loads it so the test tiers keep seeing exactly what CI does.
    dotenv: [".env"]
    cmds: ["go run ./cmd/chorusd {{.CLI_ARGS}}"]

  probe:
    desc: Probe a real satellite (needs devices.yaml)
    cmds: ["go run ./cmd/probe {{.CLI_ARGS}}"]

  reviewui:
    desc: Serve the review UI on 127.0.0.1:8080 (needs .env and `task db:up`; `-- -addr :8080` opens it to the LAN)
    # Same .env as `run`: the journal DSN, the blob directory, and the model
    # Replay re-runs turns against.
    dotenv: [".env"]
    cmds: ["go run ./cmd/reviewui {{.CLI_ARGS}}"]

  harvest:
    desc: Export a conversation's barge-in DPO candidates as JSONL (needs Postgres)
    cmds: ["go run ./cmd/harvest {{.CLI_ARGS}}"]

  enroll:
    desc: Add, list or remove the household's voiceprints in identities.yaml, e.g. -- add -id teagan -wav one.wav -wav two.wav -wav three.wav (needs the speaker-ID sidecar)
    # Same .env as `run`: SPEAKERID_URL is where chorusd finds the sidecar, so
    # a person enrolls against the model chorusd will match them with.
    dotenv: [".env"]
    cmds: ["go run ./cmd/enroll {{.CLI_ARGS}}"]
