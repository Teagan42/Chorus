name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (lint, gen, test, docs, commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # atomic needs the PR's whole commit range, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Put GOPATH/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache dev toolchain
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: toolchain-${{ runner.os }}-${{ hashFiles('Taskfile.yml', '.github/workflows/ci.yml') }}

      # task is the only entry point; everything else comes from task tools.
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - run: task tools

      - run: task gen:check

      - run: task lint

      - run: task test

      - run: task test:docs

      # Push builds have no stable base; a force-push makes before..sha invalid.
      - name: task commit:check
        if: github.event_name == 'pull_request'
        run: task commit:check -- ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # Separate job, not a step in gate: gate proves `task test` needs nothing,
  # and a services: block on that runner would stop proving it.
  db:
    name: test:db (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose.yml. A version skew here would test a
        # database no developer runs.
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: chorus
          POSTGRES_USER: chorus
          # Throwaway for a job-scoped container on localhost. The real
          # deployment password lives in a gitignored .env, never in git.
          POSTGRES_PASSWORD: chorus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chorus -d chorus"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # Set explicitly so the tests fail rather than skip: an unset DSN means
      # "this developer has no database", which must never describe CI.
      - run: task test:db
        env:
          CHORUS_POSTGRES_DSN: postgres://chorus:chorus@localhost:5432/chorus?sslmode=disable

  # Separate job for the same reason as db: the browser is a dependency
  # `task test` must keep proving it does not have.
  e2e:
    name: test:e2e (review UI in Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # Set explicitly so the tests fail rather than skip. The runner image
      # ships Chrome; a missing binary is a red build, not a quiet pass.
      - run: task test:e2e
        env:
          CHORUS_E2E_CHROME: /usr/bin/google-chrome
          CHORUS_E2E_SHOTS: ${{ runner.temp }}/reviewui-screens

      # What each screen looked like when the tests ran, pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewui-screens
          path: ${{ runner.temp }}/reviewui-screens
          if-no-files-found: ignore

  # The Python sidecars against the models they serve. Separate from gate for
  # the same reason as db and e2e: it fetches two pinned models, and `task
  # test` must keep proving it fetches nothing.
  sidecars:
    name: test:sidecars (speakerid, smartturn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # Keyed on the files that pin each digest, so a new pin fetches anew;
      # the fetch re-verifies whatever the cache restores either way.
      - uses: actions/cache@v4
        with:
          path: .models
          key: sidecar-models-${{ hashFiles('sidecars/speakerid/src/speakerid/embedder.py', 'sidecars/smartturn/src/smartturn/model.py') }}

      - run: task test:sidecars

  # The satellite configs through ESPHome's own validator, which is the only
  # check the firmware gets short of a compile: the chorus_bridge schema, the
  # board vendor's components and the wake-word model, every one resolved as
  # a flash would resolve it. Separate from gate because that resolution
  # fetches, and `task test` must keep proving it fetches nothing. The
  # secrets are stand-ins: validation reads them and nothing else does.
  firmware:
    name: firmware:config (esphome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # From the template, so a secret the configs start needing without a
      # line in the template is a red build here, not a surprise on a device.
      - name: Stand-in secrets
        run: |
          sed -e 's/^api_encryption_key: .*/api_encryption_key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' \
              -e 's/^ota_password: .*/ota_password: ci-stand-in/' \
              -e 's/^wifi_ssid: .*/wifi_ssid: ci/' \
              -e 's/^wifi_password: .*/wifi_password: ci-stand-in/' \
              esphome/secrets.example.yaml > esphome/secrets.yaml

      - run: task firmware:config -- satellite1.yaml

      - run: task firmware:config -- satellite1-main.yaml

      - run: task firmware:config -- satellite1.example.yaml

  # Blocking since every SPEC §15 critical clause has coverage. It was advisory
  # while the runtime did not exist. If it goes red, add the test — do not
  # weaken spectrace or drop a citation.
  spec:
    name: spec trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # Full report first: it names the uncovered clauses, not just the count.
      - run: task spec

      - run: task spec:check
