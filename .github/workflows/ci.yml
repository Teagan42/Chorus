name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (lint, gen, test, docs, commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # atomic needs the PR's whole commit range, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Put GOPATH/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache dev toolchain
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: toolchain-${{ runner.os }}-${{ hashFiles('Taskfile.yml', '.github/workflows/ci.yml') }}

      # task is the only entry point; everything else comes from task tools.
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - run: task tools

      - run: task gen:check

      - run: task lint

      - run: task test

      - run: task test:docs

      # Push builds have no stable base; a force-push makes before..sha invalid.
      - name: task commit:check
        if: github.event_name == 'pull_request'
        run: task commit:check -- ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # Separate job, not a step in gate: gate proves `task test` needs nothing,
  # and a services: block on that runner would stop proving it.
  db:
    name: test:db (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose.yml. A version skew here would test a
        # database no developer runs.
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: chorus
          POSTGRES_USER: chorus
          # Throwaway for a job-scoped container on localhost. The real
          # deployment password lives in a gitignored .env, never in git.
          POSTGRES_PASSWORD: chorus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chorus -d chorus"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # Set explicitly so the tests fail rather than skip: an unset DSN means
      # "this developer has no database", which must never describe CI.
      - run: task test:db
        env:
          CHORUS_POSTGRES_DSN: postgres://chorus:chorus@localhost:5432/chorus?sslmode=disable

  # Separate job for the same reason as db: the browser is a dependency
  # `task test` must keep proving it does not have.
  e2e:
    name: test:e2e (review UI in Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # Set explicitly so the tests fail rather than skip. The runner image
      # ships Chrome; a missing binary is a red build, not a quiet pass.
      - run: task test:e2e
        env:
          CHORUS_E2E_CHROME: /usr/bin/google-chrome
          CHORUS_E2E_SHOTS: ${{ runner.temp }}/reviewui-screens

      # What each screen looked like when the tests ran, pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewui-screens
          path: ${{ runner.temp }}/reviewui-screens
          if-no-files-found: ignore

  # Blocking since every SPEC §15 critical clause has coverage. It was advisory
  # while the runtime did not exist. If it goes red, add the test — do not
  # weaken spectrace or drop a citation.
  spec:
    name: spec trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # Full report first: it names the uncovered clauses, not just the count.
      - run: task spec

      - run: task spec:check
