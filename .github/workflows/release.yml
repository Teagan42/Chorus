# Versioning is derived from conventional commit subjects, not chosen by hand:
# release-please keeps a release PR open with the computed bump and changelog,
# and merging it tags the release. Binaries and images are built only from that
# tag, so a published artifact always has a changelog entry behind it.
#
# The orchestrator daemon (cmd/chorusd) ships both ways from the same tag: a
# tarball beside probe and harvest for a household on bare metal, and a
# container image on ghcr.io, so the compose file and a release install the
# same bytes.
name: release

on:
  push:
    branches: [main]

# Serialize: two merges in flight must not race on the same release PR or tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN does not trigger pull_request
          # workflows, so the release PR would sit forever with its required
          # checks never reporting. RELEASE_PLEASE_TOKEN is a PAT or App token;
          # set it or releases stall. Falls back so forks still run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Re-run the gate against the tag. The merge commit passed CI, but the tag is
  # what users install, and release-please commits a changelog on top of it.
  verify:
    name: verify the tag
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Put GOPATH/bin on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - run: task tools

      - run: task lint

      - run: task test

  binaries:
    name: binaries
    needs: [release-please, verify]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0: a static binary, and nothing here needs libc. One
      # tarball per command so a bare-metal household installs the daemon
      # without the probe, and the image job's -X main.version is the same
      # flag here: chorusd reports it; probe and harvest have no version var
      # and the linker ignores it for them.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for cmd in probe chorusd harvest; do
            out="${cmd}_${{ needs.release-please.outputs.version }}_${GOOS}_${GOARCH}"
            mkdir -p "dist/$out"
            go build -trimpath \
              -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.version }}" \
              -o "dist/$out/$cmd" "./cmd/$cmd"
            cp README.md "dist/$out/"
            tar -C dist -czf "dist/$out.tar.gz" "$out"
            # Run inside dist and keep the filename: `sha256sum -c` rejects a
            # bare digest.
            (cd dist && sha256sum "$out.tar.gz" > "$out.tar.gz.sha256")
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  image:
    name: chorusd image
    needs: [release-please, verify]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      # ghcr.io refuses an upper-case path, and the owner's login is not
      # guaranteed lower-case.
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chorusd" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # arm64 as well as amd64: a household orchestrator is as likely to be a
      # small ARM box as a workstation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/chorusd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release-please.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release-please.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
