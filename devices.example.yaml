# Copy to devices.yaml (gitignored) and fill in real values.
# psk is the base64 `api: encryption: key:` from the device's ESPHome config.

# How long the house keeps its recordings and logs (SPEC §8, ADR-0065).
# Horizons are days, written 30d; absent or 0 keeps forever, which is the
# default. audio is the PCM a log names, journal a conversation after its
# last event. Anything a reviewer curated is kept past both unless
# prune_curated is true.
# retention:
#   audio: 30d
#   journal: 365d
#   prune_curated: false

# name is the device's node name as it reports it, MAC suffix included: the
# audio link's auth frame carries it, and must come from this address (SPEC §3.2.2).
satellites:
  - name: satellite1-abcdef
    address: 10.0.0.42:6053
    # Optional. Docker Desktop's forwarded inbound connections share this
    # source IP; set it only when the daemon sees a gateway instead of device.
    # audio_source_ip: 192.168.65.1
    psk: BASE64_32_BYTE_KEY_HERE
    room: kitchen # told to the model, so "the lights" means this room's
    profile: satellite1 # satellite1 | voice-pe; informational, chorusd reads what it has from the device
    # Optional. The RMS, as a fraction of full scale, at or above which this
    # satellite's audio counts as speech; absent takes the built-in -40 dBFS
    # (listen.DefaultSpeechEnergy). Set it when a front end rides its own
    # gain: a Voice PE's XMOS AGC was measured holding an empty room at
    # -35 dBFS, over the default, so no pause was ever quiet enough to end a
    # turn and every one ran to its cap. Raise it above the room's floor and
    # below speech; 0.05 is -26 dBFS. See ADR-0083.
    # speech_energy: 0.05
    # Optional. How closely a barge-in must match what this satellite was
    # playing, from 0 to 1, to be refused as its own voice coming back through
    # the microphone; absent takes the built-in 0.6 (echo.DefaultThreshold),
    # measured on simulated echo. Every candidate's echo_score is journalled
    # on barge_in_detected and barge_in_rejected: lower it if echo still gets
    # through, raise it if people are refused at the echo stage. Above 1
    # turns the stage off. See ADR-0096.
    # echo_threshold: 0.6
    # Optional. The cosine below which this satellite's best match is a
    # guest, overriding CHORUS_SPEAKER_ACCEPT for this satellite alone. A
    # far-field front end compresses every score and a close microphone does
    # not, so one house-wide level either refuses the household on one or
    # admits strangers on the other. Lower it only from your own room's
    # measurements, with more than one voice enrolled. See ADR-0098.
    # speaker_accept: 0.50
    # Optional. The peak-to-RMS ratio in dB above which a brief utterance is
    # a click rather than a voice; absent takes the measured 22 dB
    # (listen.DefaultMaxCrest). Raise it if short words from this room are
    # logged as "decoded words from an impulse". See ADR-0090, ADR-0098.
    # max_crest: 22
    # retention: # this satellite's own horizons; what it leaves out is the house's
    #   audio: 7d
