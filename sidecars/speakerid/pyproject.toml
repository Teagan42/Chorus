[project]
name = "speakerid"
version = "0.1.0"
description = "Speaker embeddings over HTTP for Chorus: ECAPA-TDNN behind POST /v1/embed (SPEC §10)"
requires-python = ">=3.13"
# Exact pins, like the Go tools: a model or framework release must not change
# every embedding under an enrolled household with no code change.
dependencies = [
  "fastapi==0.142.4",
  "uvicorn==0.54.0",
  "numpy==2.5.3",
  "speechbrain==1.1.1",
  "torch==2.11.0",
  "torchaudio==2.11.0",
]

[project.scripts]
speakerid = "speakerid.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"
