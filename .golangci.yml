version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - nilerr
    - rowserrcheck
    - unconvert

  settings:
    errcheck:
      # Deferred cleanup and writes to stdout have no actionable error. Keeping
      # them in the report trains everyone to ignore the whole report.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - os.RemoveAll
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

    staticcheck:
      # ST1000/ST1003: naming and package-comment style, already covered by
      # review. QF*: editor quickfix suggestions, not defects.
      checks: ["all", "-ST1000", "-ST1003", "-QF1001", "-QF1003", "-QF1012"]

  exclusions:
    rules:
      # Generated code is the generator's problem, not the reviewer's.
      - path: '\.gen\.go'
        linters: [errcheck, govet, staticcheck, unused]
      - path: 'internal/pb/'
        linters: [errcheck, govet, staticcheck, unused]
      # Build-time tooling exits on error; wrapping every write adds noise.
      - path: 'internal/tools/'
        linters: [errcheck]

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
