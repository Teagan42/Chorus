# Every part the chorus-main sheets may place, with every pad on its
# footprint. `go test ./internal/board` refuses a sheet that wires a pin not
# listed here, leaves a pad off every net, or places a part JLCPCB cannot
# source without saying so. docs/hardware/README.md explains the choices.
#
#   symbol      KiCad lib:symbol, for the drawn schematic
#   footprint   KiCad lib:footprint; chorus-main:* are drawn or vendored for
#               this board, in chorus-main.pretty
#   pinout      where the pad table was read; "inferred" where nothing states it
#   mpn         the manufacturer's part number
#   lcsc        JLCPCB's catalogue number
#   values      for parts bought by value: each value the board uses, with its
#               number, or "" for JLCPCB to match from its basic library
#   hand        why JLCPCB cannot place it, when it cannot
#   side        back for a part mounted on B.Cu
#   unverified  what about the part is not yet confirmed; the board is not
#               ordered while any part says so
#
# Most parts are rev A's (hardware/chorus-sat, retired; see ADR-0055), so
# their pad tables were read then. Sources named below: [S1] FutureProofHomes
# Satellite1 HAT rev 6.1 schematic at 2eb08ffa; [SHOE] their mini speaker
# shoe rev 1, schematic and 3D model at 2eb08ffa; [PROTO] their Satellite1
# protoboard rev 1 render at 2eb08ffa; [WIZ] WIZnet W5500-EVB-Pico-PoE
# schematic at e3f0b08d; [AG] Silvertel Ag9900M datasheet v3.4.
#
# Parts on the back are the tall ones. The Core hangs from the HAT's
# underside into the gap above this board, so its top side carries only low
# parts and the receptacle, as FutureProofHomes' shoe does.

