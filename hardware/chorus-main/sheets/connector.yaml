sheet: connector
title: The Satellite1 HAT's expansion connector, and the speaker
parts:
  J1:
    part: FX23L-80S-0.5SV
    note: >-
      mates the HAT's J7; centred 10 mm above the HAT's centre, pad 1 toward
      +x, as FutureProofHomes' shoe places it
  J2: {part: JST_PH_2P_VERTICAL, note: "speaker, for a driver in the base; the HAT's own speaker connector is the other choice"}
nets:
  # The kit's ground pads, every one: the connector is the only return path
  # for the HAT's audio and the W5500's SPI.
  GND:
    - J1.6
    - J1.9
    - J1.14
    - J1.20
    - J1.25
    - J1.30
    - J1.34
    - J1.39
    - J1.46
    - J1.49
    - J1.52
    - J1.54
    - J1.59
    - J1.MH1
    - J1.MH3
  5V0: [J1.MH2]
  VBUS: [J1.MH4]

  # The HAT's amplifier output, both pads of each side.
  SPK_P: [J1.63, J1.64, J2.1]
  SPK_N: [J1.65, J1.66, J2.2]

  # The ESP32's pins this board takes; pins.yaml says which and why.
  ETH_RST_N: [J1.13]
  ETH_MOSI: [J1.16]
  ETH_SCLK: [J1.22]
  ETH_MISO: [J1.31]
  ETH_INT_N: [J1.33]
  POE_SENSE: [J1.36]
  ETH_CS_N: [J1.37]
nc:
  # Everything else the kit puts on J7 is the HAT's and the Core's business,
  # and the pads the HAT leaves unconnected stay that way here.
  - J1.1
  - J1.2
  - J1.3
  - J1.4
  - J1.5
