  - {pad: "33", label: GPIO13, gpio: 38}
  - {pad: "34", label: GND, net: GND, use: ground}
  - {pad: "35", label: I2S_LRCLK, net: I2S_LRCLK, gpio: 7, use: "XU316 word clock", satellite1: "i2s_audio[0].i2s_lrclk_pin"}
  - {pad: "36", label: GPIO42, gpio: 42}
  - {pad: "37", label: GPIO03, gpio: 3}
