sheet: voice_dsp
title: XU316 voice frontend, redrawn from the Satellite1 HAT rev 6.1 p3
parts:
  U30: {part: XU316-1024-QF60B, note: Satellite1 fits the -I32; the -C32 is the same die at commercial temperature and is the one in stock}
  U31: {part: W25Q64JVSSIQ, note: XU316 boot flash; the ESP32 writes it while XMOS_RST holds the XU316 in reset}
  U32: {part: BL1530TQFN, note: "SPI mux, clock and chip select"}
  U33: {part: BL1530TQFN, note: "SPI mux, MOSI and MISO"}
  Q30: {part: FDV301N, note: XMOS_RST high pulls RST_N low}
  R30: {part: R_0402, value: 10k, note: "RST_N pull-up, on the 1.8 V domain [XDS] p33"}
  R31: {part: R_0402, value: 10k, note: holds the XU316 running while the ESP32 boots}
  Y30: {part: XTAL_24M_2016}
  R32: {part: R_0402, value: 1M, note: "crystal feedback [XDS] p23"}
  R33: {part: R_0402, value: 680R, note: "crystal drive [XDS] p23"}
  C30: {part: C_0402, value: 10pF}
  C31: {part: C_0402, value: 10pF}
  J30: {part: TC2030, dnp: true, note: "XU316 JTAG, all at 1.8 V"}
  R34: {part: R_0402, value: 0R, dnp: true, note: "MCLK to the ESP32, unfitted; an I2S secondary needs none"}
  R35: {part: R_0402, value: 4k7, note: flash CS pull-up}
  R36: {part: R_0402, value: 4k7, note: I2C SCL pull-up}
  R37: {part: R_0402, value: 4k7, note: I2C SDA pull-up}
  R38: {part: R_0402, value: 4k7, note: shared I2C_IRQ pull-up}
  FB30: {part: FB_600R_0603, note: "PLL supply filter [XDS] p34"}
  C32: {part: C_0402, value: 1uF, note: PLL_AVDD}
  C33: {part: C_0603, value: 10uF, note: 0V9 bulk at the chip}
  C34: {part: C_0402, value: 1uF}
  C35: {part: C_0402, value: 100nF}
  C36: {part: C_0402, value: 100nF}
  C37: {part: C_0402, value: 100nF}
  C38: {part: C_0402, value: 100nF}
  C39: {part: C_0402, value: 100nF}
  C40: {part: C_0402, value: 100nF}
  C41: {part: C_0402, value: 100nF}
  C42: {part: C_0402, value: 100nF}
  C43: {part: C_0402, value: 100nF, note: 1V8}
  C44: {part: C_0402, value: 100nF, note: 1V8}
  C45: {part: C_0402, value: 100nF, note: 1V8}
  C46: {part: C_0603, value: 10uF, note: 3V3 bulk at the chip}
  C47: {part: C_0402, value: 100nF, note: VDDIOL}
  C48: {part: C_0402, value: 100nF, note: VDDIOR}
  C49: {part: C_0402, value: 100nF, note: VDDIOT}
  C50: {part: C_0402, value: 100nF, note: USB_VDD33}
  C51: {part: C_0402, value: 100nF, note: flash}
  C52: {part: C_0402, value: 100nF, note: U32}
  C53: {part: C_0402, value: 100nF, note: U33}
power:
  0V9_PLL: the core rail through FB30
nets:
  0V9: [U30.VDD, FB30.1, C33.1, C34.1, C35.1, C36.1, C37.1, C38.1, C39.1, C40.1, C41.1, C42.1]
  0V9_PLL: [FB30.2, U30.PLL_AVDD, C32.1]
  1V8: [U30.VDDIOB18, U30.USB_VDD18, R30.1, J30.VREF, C43.1, C44.1, C45.1]
  3V3:
    - U30.VDDIO
    - U30.USB_VDD33
    - U31.VCC
    - U32.VCC
    - U33.VCC
    - R35.1
    - R36.1
    - R37.1
    - R38.1
    - C46.1
    - C47.1
    - C48.1
    - C49.1
    - C50.1
    - C51.1
    - C52.1
    - C53.1
  GND:
    - U30.GND
    - U31.GND
    - U32.GND
    - U32.OEB
    - U33.GND
    - U33.OEB
    - Q30.S
    - R31.2
    - Y30.GND
    - C30.2
    - C31.2
    - J30.GND
    - C32.2
    - C33.2
    - C34.2
    - C35.2
    - C36.2
    - C37.2
    - C38.2
    - C39.2
    - C40.2
    - C41.2
    - C42.2
    - C43.2
    - C44.2
    - C45.2
    - C46.2
    - C47.2
    - C48.2
    - C49.2
    - C50.2
    - C51.2
    - C52.2
    - C53.2

  # Clock and reset
  XMOS_XIN: [U30.XIN, R32.1, Y30.1, C30.1]
  XMOS_XOUT: [U30.XOUT, R32.2, R33.1]
  XMOS_XTAL: [R33.2, Y30.3, C31.1]
  XMOS_RST_N: [U30.RST_N, R30.2, Q30.D]
  XMOS_RST: [Q30.G, R31.1, U32.SEL, U33.SEL]
  XMOS_TCK: [U30.TCK, J30.TCK]
  XMOS_TMS: [U30.TMS, J30.TMS]
  XMOS_TDI: [U30.TDI, J30.TDI]
  XMOS_TDO: [U30.TDO, J30.TDO]

  # The ESP32's SPI through the muxes: SEL low (XMOS running) to the XU316's
  # SPI slave, SEL high (XMOS in reset) to its boot flash ([S1] p3).
  XMOS_SPI_SCLK: [U32.DN]
  XMOS_SPI_CS_N: [U32.DP]
  XMOS_SPI_MOSI: [U33.DN]
  XMOS_SPI_MISO: [U33.DP]
  XSPI_SCLK: [U32.DN1, U30.X0D35]
  XSPI_CS_N: [U32.DP1, U30.X0D00]
  XSPI_MOSI: [U33.DN1, U30.X0D39]
  XSPI_MISO: [U33.DP1, U30.X0D36]
  QSPI_CLK: [U32.DN2, U30.X0D10, U31.CLK]
  QSPI_CS_N: [U32.DP2, U30.X0D01, U31.CS_N, R35.2]
  QSPI_D0: [U33.DN2, U30.X0D04, U31.IO0]
  QSPI_D1: [U33.DP2, U30.X0D05, U31.IO1]
  QSPI_D2: [U30.X0D06, U31.IO2]
  QSPI_D3: [U30.X0D07, U31.IO3]

  # Audio. The XU316 masters every clock on the board.
  I2S_BCLK: [U30.X1D10]
  I2S_LRCLK: [U30.X1D01]
  XMOS_MCLK: [U30.X1D11, R34.1]
  I2S_MCLK: [R34.2]
  I2S_DIN: [U30.X1D34]
  I2S_DOUT: [U30.X1D13]
  AMP_SDIN: [U30.X1D00]
  PDM_CLK_X: [U30.X1D22]
  PDM_DATA_1: [U30.X1D16]
  PDM_DATA_2: [U30.X1D17]
  PDM_DATA_3: [U30.X1D18]
  PDM_DATA_4: [U30.X1D19]

  # Control
  I2C_SCL: [U30.X0D37, R36.2]
  I2C_SDA: [U30.X0D38, R37.2]
  I2C_IRQ: [U30.X0D32, R38.2]
  MIC_MUTED: [U30.X0D43]
nc:
  # Satellite1's encoder, button and LED-ring pins: the buttons and ring are
  # the ESP32's on this board. USB is unused.
  - U30.X0D11
  - U30.X0D29
  - U30.X0D30
  - U30.X0D31
  - U30.X0D33
  - U30.X0D40
  - U30.X0D41
  - U30.X0D42
  - U30.X1D09
  - U30.USB_DM
  - U30.USB_DP
