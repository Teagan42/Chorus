sheet: mcu
title: ESP32-S3 module, reset and buttons
parts:
  U1: {part: ESP32-S3-WROOM-1-N16R8}
  C1: {part: C_0805, value: 22uF 25V, note: "bulk at the module's 3V3 pad, per Espressif"}
  C2: {part: C_0402, value: 100nF}
  R1: {part: R_0402, value: 10k, note: EN pull-up}
  C3: {part: C_0402, value: 1uF, note: "EN delay, so 3V3 is up before the chip starts"}
  SW1: {part: TS-1187A-B-A-B, note: reset}
  SW2: {part: TS-1187A-B-A-B, note: action; held at power-on it is BOOT and enters download mode}
  R2: {part: R_0402, value: 10k}
  SW3: {part: TS-1187A-B-A-B, note: volume up}
  R3: {part: R_0402, value: 10k}
  SW4: {part: TS-1187A-B-A-B, note: volume down}
  R4: {part: R_0402, value: 10k}
nets:
  3V3: [U1.3V3, C1.1, C2.1, R1.1, R2.1, R3.1, R4.1]
  GND: [U1.GND, C1.2, C2.2, C3.2, SW1.2, SW2.2, SW3.2, SW4.2]
  ESP_EN: [U1.EN, R1.2, C3.1, SW1.1]

  # Every net below is in pins.yaml; the board test holds each to its GPIO.
  I2S_LRCLK: [U1.IO7]
  I2S_BCLK: [U1.IO8]
  I2S_MCLK: [U1.IO16]
  I2S_DOUT: [U1.IO9]
  I2S_DIN: [U1.IO15]
  XMOS_RST: [U1.IO4]
  XMOS_SPI_CS_N: [U1.IO10]
  XMOS_SPI_SCLK: [U1.IO12]
  XMOS_SPI_MOSI: [U1.IO11]
  XMOS_SPI_MISO: [U1.IO13]
  I2C_SDA: [U1.IO5]
  I2C_SCL: [U1.IO6]
  I2C_IRQ: [U1.IO1]
  USB_DN: [U1.IO19]
  USB_DP: [U1.IO20]
  AMP_SENSE: [U1.IO17]
  PWR_SRC: [U1.IO18]
  MUTE_SENSE: [U1.IO2]
  LED_DATA: [U1.IO14]
  ETH_CS_N: [U1.IO38]
  ETH_SCLK: [U1.IO39]
  ETH_MOSI: [U1.IO40]
  ETH_MISO: [U1.IO41]
  ETH_INT_N: [U1.IO42]
  ETH_RST_N: [U1.IO21]
  RADAR_TX: [U1.IO43]
  RADAR_RX: [U1.IO44]
  BTN_ACTION: [U1.IO0, R2.2, SW2.1]
  BTN_VOL_UP: [U1.IO47, R3.2, SW3.1]
  BTN_VOL_DOWN: [U1.IO48, R4.2, SW4.1]
nc:
  # IO3 picks the JTAG source and IO46 the ROM log; both are straps left at
  # their efuse defaults. IO45 is the flash-voltage strap. IO35-37 are the
  # octal PSRAM's, inside the can.
  - U1.IO3
  - U1.IO46
  - U1.IO45
  - U1.IO35
  - U1.IO36
  - U1.IO37
