sheet: regulators
title: 3V3, 5V0, 0V9, 1V8 and 1V8A
parts:
  # Both TPS62933 bucks run at 1.2 MHz (RT to ground) and start on their own:
  # EN has an internal pull-up and is rated 6 V, so it floats rather than
  # meeting VSYS. SS has no internal soft start and must not float; 10 nF
  # gives 1.5 ms. Values from TI SLUSEA4D pp3-7 and table 10-2.
  #
  # 3V3 from VSYS: ESP32, W5500, XU316 I/O, and the 0V9 and 1V8 rails below.
  U90: {part: TPS62933DRLR, note: 3V3 buck}
  L90: {part: L_2u2_4040}
  C600: {part: C_0805, value: 10uF 25V, note: input}
  C601: {part: C_0402, value: 100nF, note: input}
  C602: {part: C_0402, value: 100nF, note: bootstrap}
  C616: {part: C_0402, value: 10nF, note: soft start}
  C603: {part: C_0805, value: 22uF 25V, note: output}
  C604: {part: C_0805, value: 22uF 25V, note: output}
  R600: {part: R_0402, value: 100k, note: FB top}
  R601: {part: R_0402, value: 33k, note: "FB bottom: 0.8 V x (1 + 100/33) = 3.22 V"}

  # 5V0 from VSYS: the LED ring, the radar and the amplifier's VBAT1S.
  U91: {part: TPS62933DRLR, note: 5V0 buck}
  L91: {part: L_4u7_4040, note: "TI lists 3.3 uH at 1.2 MHz; this family has none on LCSC, and 4.7 uH trades transient response for ripple"}
  C605: {part: C_0805, value: 10uF 25V, note: input}
  C606: {part: C_0402, value: 100nF, note: input}
  C607: {part: C_0402, value: 100nF, note: bootstrap}
  C617: {part: C_0402, value: 10nF, note: soft start}
  C608: {part: C_0805, value: 22uF 25V, note: output}
  C609: {part: C_0805, value: 22uF 25V, note: output}
  R602: {part: R_0402, value: 100k, note: FB top}
  R603: {part: R_0402, value: 20k, note: "FB bottom: 0.8 V x (1 + 100/20) = 4.8 V"}

  # 0V9 from 3V3: the XU316 core, up to 1.11 A on the -32 parts ([XDS] p41).
  # The TLV62569 takes 5.5 V at most, so it hangs off 3V3, not VSYS, and its EN
  # has no pull, so it is tied on.
  U92: {part: TLV62569DBVR, note: 0V9 buck}
  L92: {part: L_2u2_1008}
  C610: {part: C_0603, value: 10uF, note: input}
  C611: {part: C_0805, value: 22uF 25V, note: output}
  R604: {part: R_0402, value: 10k, note: FB top}
  R605: {part: R_0402, value: 20k, note: "FB bottom: 0.6 V x (1 + 10/20) = 0.9 V"}

  # 1V8 from 3V3: XU316 VDDIOB18, reset and JTAG. 1V8A: the amplifier's AVDD.
  U93: {part: TLV75518PDBVR, note: 1V8 LDO}
  C612: {part: C_0402, value: 1uF, note: input}
  C613: {part: C_0402, value: 1uF, note: output}
  U94: {part: TLV75518PDBVR, note: "1V8A LDO, analog, for the TAS2780 alone as on [S1] p8"}
  C614: {part: C_0402, value: 1uF, note: input}
  C615: {part: C_0402, value: 1uF, note: output}
power:
  3V3: U90 through L90
  5V0: U91 through L91
  0V9: U92 through L92
nets:
  VSYS: [U90.VIN, U91.VIN, C600.1, C601.1, C605.1, C606.1]
  3V3: [L90.2, C603.1, C604.1, R600.1, U92.VIN, U92.EN, C610.1, U93.IN, U93.EN, C612.1, U94.IN, U94.EN, C614.1]
  5V0: [L91.2, C608.1, C609.1, R602.1]
  0V9: [L92.2, C611.1, R604.1]
  1V8: [U93.OUT, C613.1]
  1V8A: [U94.OUT, C615.1]
  BUCK3_SW: [U90.SW, L90.1, C602.2]
  BUCK3_BST: [U90.BST, C602.1]
  BUCK3_FB: [U90.FB, R600.2, R601.1]
  BUCK3_SS: [U90.SS, C616.1]
  BUCK5_SW: [U91.SW, L91.1, C607.2]
  BUCK5_BST: [U91.BST, C607.1]
  BUCK5_FB: [U91.FB, R602.2, R603.1]
  BUCK5_SS: [U91.SS, C617.1]
  BUCK09_SW: [U92.SW, L92.1]
  BUCK09_FB: [U92.FB, R604.2, R605.1]
  GND:
    - U90.GND
    - U90.RT
    - U91.GND
    - U91.RT
    - U92.GND
    - U93.GND
    - U94.GND
    - C600.2
    - C601.2
    - C603.2
    - C604.2
    - R601.2
    - C616.2
    - C605.2
    - C606.2
    - C608.2
    - C609.2
    - R603.2
    - C617.2
    - C610.2
    - C611.2
    - R605.2
    - C612.2
    - C613.2
    - C614.2
    - C615.2
nc:
  - U90.EN
  - U91.EN
