sheet: amp
title: TAS2780 amplifier, with its sense output to the ESP32
parts:
  U50: {part: TAS2780RYAR, note: I2C 0x3F with ADDR on AVDD}
  J50: {part: JST_PH_2P_VERTICAL, note: "speaker, a 40-50 mm 4 ohm driver"}
  C200: {part: C_0402, value: 100nF, note: PVDD}
  C201: {part: C_0805, value: 22uF 25V, note: PVDD}
  C202: {part: C_0805, value: 22uF 25V, note: PVDD}
  R200: {part: R_0402, value: 1k, note: PVDD_SNS filter}
  C203: {part: C_0402, value: 10nF, note: PVDD_SNS filter}
  C204: {part: C_0402, value: 100nF, note: VBAT1S}
  C205: {part: C_0402, value: 1uF, note: VBAT1S}
  C206: {part: C_0603, value: 10uF, note: VBAT1S}
  C207: {part: C_0603, value: 10uF, note: AVDD}
  C208: {part: C_0402, value: 1uF, note: IOVDD}
  C209: {part: C_0402, value: 1uF, note: DREG}
  C210: {part: C_0402, value: 100nF, note: "bootstrap, OUT_P"}
  C211: {part: C_0402, value: 100nF, note: "bootstrap, OUT_N"}
  R201: {part: R_0402, value: 1k, note: "voltage sense, taken at the speaker connector"}
  R202: {part: R_0402, value: 1k, note: "voltage sense, taken at the speaker connector"}
nets:
  VSYS: [U50.PVDD, R200.1, C200.1, C201.1, C202.1]
  AMP_PVDD_SNS: [U50.PVDD_SNS, R200.2, C203.1]
  5V0: [U50.VBAT1S, C204.1, C205.1, C206.1]
  1V8A: [U50.AVDD, U50.ADDR, C207.1]
  3V3: [U50.IOVDD, U50.SDZ, C208.1]
  GND:
    - U50.PGND
    - U50.GND
    - U50.DGND
    - C200.2
    - C201.2
    - C202.2
    - C203.2
    - C204.2
    - C205.2
    - C206.2
    - C207.2
    - C208.2
    - C209.2
  AMP_DREG: [U50.DREG, C209.1]
  AMP_BST_P: [U50.BST_P, C210.1]
  AMP_BST_N: [U50.BST_N, C211.1]
  # Filterless class D, as the Satellite1 builds it (its ferrites are unfitted).
  SPK_P: [U50.OUT_P, C210.2, J50.1, R201.1]
  SPK_N: [U50.OUT_N, C211.2, J50.2, R202.1]
  AMP_VSNS_P: [U50.VSNS_P, R201.2]
  AMP_VSNS_N: [U50.VSNS_N, R202.2]

  AMP_SDIN: [U50.SDIN]
  I2S_LRCLK: [U50.FSYNC]
  I2S_BCLK: [U50.SBCLK]
  # New on this board: the sensed speaker current and voltage, to the ESP32.
  AMP_SENSE: [U50.SDOUT]
  I2C_SCL: [U50.SCL]
  I2C_SDA: [U50.SDA]
  I2C_IRQ: [U50.IRQZ]
nc:
  - U50.ICC
  - U50.BYP_EN
