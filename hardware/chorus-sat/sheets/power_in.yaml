sheet: power_in
title: PoE and USB-C in, and the mux between them
parts:
  # PoE: the magjack's centre taps (ethernet sheet), two bridges so either
  # polarity and either pair set works, a TVS, then the isolated 12 V module.
  BR1: {part: MB6S, note: "data-pair taps, mode A"}
  BR2: {part: MB6S, note: "spare-pair taps, mode B"}
  D1: {part: SMAJ58A, note: across the PoE input}
  U80: {part: AG9912-MTB, note: "802.3af PD, isolated 12 V at 1 A; ADJ open is 12 V"}
  C500: {part: CP_100u_25V, note: "AG9912 output, as its application circuit"}
  C501: {part: C_0805, value: 10uF 25V, note: AG9912 output}

  # USB-C: sink only. The FUSB302B asks the charger for 12 V.
  J80: {part: USB_C_HRO_TYPE-C-31-M-12}
  U81: {part: USBLC6-2SC6, note: ESD on the data pair}
  D2: {part: SMAJ24A, note: VBUS clamp; PD tops out at 20 V and the mux at 22 V}
  U82: {part: FUSB302BMPX, note: "I2C 0x22, as the Satellite1"}
  C502: {part: C_0402, value: 220pF, note: "CC1, as [S1] p9"}
  C503: {part: C_0402, value: 220pF, note: "CC2, as [S1] p9"}
  C504: {part: C_0402, value: 1uF, note: FUSB302B VDD}
  C505: {part: C_0402, value: 1uF, note: FUSB302B VCONN}
  C506: {part: C_0402, value: 100nF, note: FUSB302B VCONN}
  C507: {part: C_0805, value: 10uF 25V, note: VBUS}

  # The mux: PoE first, USB-C when there is no PoE.
  U83: {part: TPS2121RUXR, note: "IN1 PoE 12 V, IN2 USB VBUS"}
  R500: {part: R_0402, value: 100k, note: PR1 divider top; IN1 wins above about 9.9 V}
  R501: {part: R_0402, value: 12k, note: PR1 divider bottom}
  R502: {part: R_0402, value: 100k, note: OV2 divider top; USB is cut above about 21.8 V}
  R503: {part: R_0402, value: 5k1, note: OV2 divider bottom}
  R504: {part: R_0402, value: 10k, note: "ST pull-up to 3V3, inside the 6-20k TI asks; ST high means IN1, PoE"}
  R505: {part: R_0402, value: 33k, note: "ILM: 65.2 / 33^0.861 = 3.2 A, TI SLVSEA3C eq. 2"}
  C508: {part: C_0402, value: 100nF, note: "SS: about 800 V/s, as TI's example"}
  C509: {part: C_0805, value: 22uF 25V, note: VSYS}
  C510: {part: C_0402, value: 100nF, note: VSYS}
power:
  VBUS: the USB-C receptacle
  POE_VIN_P: the PoE bridges' positive output
  POE_VIN_N: the PoE bridges' negative output, isolated from GND
  GND: the board's ground, the AG9912's isolated output return and USB ground
nets:
  POE_VC1: [BR1.AC1]
  POE_VC2: [BR1.AC2]
  POE_VC3: [BR2.AC1]
  POE_VC4: [BR2.AC2]
  POE_VIN_P: [BR1.P, BR2.P, D1.K, U80.VIN_P]
  POE_VIN_N: [BR1.N, BR2.N, D1.A, U80.VIN_N]
  POE_12V: [U80.VDC_P, C500.P, C501.1, U83.IN1, R500.1]

  VBUS: [J80.VBUS, D2.K, U82.VBUS, C507.1, U83.IN2, R502.1]
  USB_CC1: [J80.CC1, U82.CC1, C502.1]
  USB_CC2: [J80.CC2, U82.CC2, C503.1]
  USB_DP: [J80.DP, U81.IO2]
  USB_DN: [J80.DN, U81.IO1]
  3V3: [U81.VBUS, U82.VDD, C504.1, R504.1]
  5V0: [U82.VCONN, C505.1, C506.1]
  I2C_SCL: [U82.SCL]
  I2C_SDA: [U82.SDA]
  I2C_IRQ: [U82.INT_N]

  MUX_PR1: [U83.PR1, R500.2, R501.1]
  MUX_OV2: [U83.OV2, R502.2, R503.1]
  MUX_ILM: [U83.ILM, R505.1]
  MUX_SS: [U83.SS, C508.1]
  PWR_SRC: [U83.ST, R504.2]
  VSYS: [U83.OUT, C509.1, C510.1]

  GND:
    - U80.VDC_N
    - C500.N
    - C501.2
    - J80.GND
    - J80.SHIELD
    - U81.GND
    - D2.A
    - U82.GND
    - C502.2
    - C503.2
    - C504.2
    - C505.2
    - C506.2
    - C507.2
    - U83.GND
    - U83.CP2
    - U83.OV1
    - R501.2
    - R503.2
    - R505.2
    - C508.2
    - C509.2
    - C510.2
nc:
  - U80.ADJ
  - J80.SBU1
  - J80.SBU2
